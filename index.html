<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vikunja Voice">
    <meta name="theme-color" content="#111827">
    
    <title>Vikunja Voice</title>
    
    <!-- Cache buster -->
    <link rel="manifest" href="manifest.json?v=3">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/ORQUESTRADOR-max/vikunja-voice-pwa/master/icon-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            -webkit-tap-highlight-color: transparent; 
            touch-action: none; 
            overscroll-behavior-y: none;
        }
        .recording { animation: pulse 1.5s infinite; }
        @keyframes pulse { 
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } 
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } 
        }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen w-screen flex flex-col items-center justify-center overflow-hidden fixed">
    <div class="text-center mb-12">
        <h1 class="text-3xl font-bold mb-2 text-blue-400">Vikunja Voice</h1>
        <p class="text-gray-400 text-sm">Segure para gravar suas tarefas</p>
    </div>
    
    <button id="recordBtn" class="w-32 h-32 rounded-full bg-blue-600 text-white flex items-center justify-center text-4xl shadow-lg transition-transform transform active:scale-95 focus:outline-none select-none">
        <i class="fas fa-microphone"></i>
    </button>

    <div id="status" class="mt-8 text-gray-300 font-medium h-6 text-center px-4">Pronto para gravar</div>
    
    <script src="app.js?v=2"></script>
</body>
</html>
